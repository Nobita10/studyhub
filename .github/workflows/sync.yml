name: Sync YouTube Videos

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run sync script
        run: python scripts/sync.py

      - name: Commit updated videos.json
        run: |
          git config user.name "StudyHub Bot"
          git config user.email "bot@studyhub"
          git add videos.json
          git diff --staged --quiet || git commit -m "🔄 Auto-sync: $(date '+%Y-%m-%d')"
          git push
